<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add a Quiz</title>
  <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>

<body class="container">
  <h2>Add a Quiz</h2>

  <form th:object="${quiz}" th:action="@{/addquiz}" method="post">

    <div class="mb-3">
      <label class="form-label" for="name">Name:</label>
      <input id="author" class="form-control" type="text" th:field="*{name}" placeholder="Enter name of quiz"
        title="Quiz name" required>
    </div>

    <div class="mb-3">
      <label class="form-label" for="description">Description:</label>
      <input id="title" class="form-control" type="text" th:field="*{description}" placeholder="Enter description"
        title="Description" required>
    </div>

    <div class="mb-3">
      <label class="form-label" for="courseCode">Course Code:</label>
      <input id="isbn" class="form-control" type="text" th:field="*{courseCode}" placeholder="Enter course code"
        title="Course code" required>
    </div>

    <div class="mb-3">
      <label>
        <input type="checkbox" th:field="*{published}">
      </label>
    </div>

    <button class="btn btn-success" type="submit">Save quiz</button>
    <a class="btn btn-secondary" th:href="@{/teacherdashboard}">Cancel</a>
  </form>
</body>

</html>
