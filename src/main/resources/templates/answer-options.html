<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Answer Options | Quizzer</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header class="navbar">
        <div class="brand"><span class="brand-icon">Q</span><span>Quizzer</span></div>
        <nav>
            <a th:href="@{/}" class="nav-link">Dashboard</a>
            <a th:href="@{/quizzes/new}" class="nav-link">Create Quiz</a>
        </nav>
        <div class="user-profile"><span class="avatar">T</span><span>Teacher</span></div>
    </header>

    <main class="page-container">
        <div class="page-heading page-heading-with-action">
            <div>
                <h1>Answer options</h1>
                <p class="subtitle" th:text="${question.questionText}">Question</p>
            </div>
            <a th:href="@{/questions/{id}/options/new(id=${question.id})}" class="submit-button">
                + Add answer option
            </a>
        </div>

        <section class="quiz-section">
            <div th:if="${#lists.isEmpty(options)}" class="empty-state">
                <h3>No answer options yet</h3>
                <p>Click Add answer option to get started.</p>
            </div>

            <div th:if="${not #lists.isEmpty(options)}" class="quiz-table-container">
                <table class="quiz-table">
                    <thead>
                        <tr>
                            <th>Answer option</th>
                            <th>Correct</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="option : ${options}">
                            <td th:text="${option.optionText}">Option</td>
                            <td th:text="${option.correct ? 'Correct' : 'Incorrect'}">Incorrect</td>
                            <td>
                                <form class="delete"
                                    th:action="@{/questions/{questionId}/options/{id}/delete(questionId=${question.id}, id=${option.id})}"
                                    method="post" style="display:inline">
                                    <button type="submit" class="cancel-button">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
        <div class="return_nav">
            <a th:href="@{/quizzes/{id}/questions(id=${question.quiz.id})}">← Back to questions</a>
        </div>
    </main>

</body>

</html>
