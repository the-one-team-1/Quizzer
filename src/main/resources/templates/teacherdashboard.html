<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard</title>
  <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
  <div class="d-flex align-items-center justify-content-between">
    <div th:if="${username != null}">
      <span th:text="|${username} (${role})|"></span>
      <form th:action="@{/logout}" method="post">
        <button type="submit">Log Out</button>
      </form>
    </div>
  </div>

  <table class="table table-striped mt-5">
    <tr>
      <th>Name</th>
      <th>Course Code</th>
      <th>Description</th>
      <th>Status</th>
      <th>Action</th>
    </tr>

    <tr th:each="quiz : ${quizzes}">
      <td th:text="${quiz.name}"></td>
      <td th:text="${quiz.courseCode}"></td>
      <td th:text="${quiz.description}"></td>
      <td th:text="${quiz.status}"></td>
      <td>
        <form th:action="@{/quiz/delete/{id}(id=${quiz.id})}" method="post">
          <button class="btn btn-danger" type="submit">Delete</button>
        </form>
        <form th:action="@{/quiz/edit}" method="post">
          <button class="btn btn-success" type="submit">Edit</button>
        </form>
      </td>
    </tr>

    <tr>
      <td colspan="6">
        <a class="btn btn-success" th:href="@{/quiz/addaquiz}">
          Add a Quiz
        </a>
      </td>
    </tr>
  </table>
</body>

</html>
